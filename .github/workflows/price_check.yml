name: Price Check
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi beautifulsoup4 python-dotenv

      - name: Run scraper
        env:
          api_key: ${{ secrets.api_key }}
          receiver_id: ${{ secrets.receiver_id }}
        run: python the_scraper.py

      - name: Save price.txt back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add price.txt
          git diff --staged --quiet || git commit -m "update price.txt"
          git push